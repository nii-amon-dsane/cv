# Master Profile - Preferences & Criteria
# Last updated: 2026-10-07

# ============================================================
# TARGET ROLE TYPES
# ============================================================
target_roles:
  - Chief Product & Technology Officer (primary)
  - CTO with meaningful Product ownership
  - Chief Product Officer where deep technology/platform experience is valuable
  - VP / Head of Product & Technology
  - VP / Head of Engineering (selective; only where the mandate is broader than engineering management)
  - Fractional CTO / technology strategy advisory
  - Advisory / Board

# ============================================================
# ROLE SHAPE
# ============================================================
role_shape:
  product_ownership: true
  technical_depth: "CTO who still architects systems and occasionally codes"
  notes: "Do not position VP Engineering alone as the primary target; it understates Product leadership scope."

# ============================================================
# GEOGRAPHIES
# ============================================================
geographies:
  - Nairobi (current base; on-site / hybrid)
  - Global remote
  - Global relocation

# ============================================================
# WORK MODE
# ============================================================
work_mode:
  on_site_nairobi: true
  hybrid: true
  remote: true
  relocation: true

# ============================================================
# COMPANY ENVIRONMENT
# ============================================================
company_environment:
  stage_preference: "Flexible across startup, scale-up and established organisations"
  priority: "Culture and how people are treated matter more than company stage"

# ============================================================
# SECTORS - INTERESTED
# ============================================================
sectors_interested:
  - Fintech (payments, lending, banking, remittances, wallets)
  - Marketplaces / e-commerce (two-sided, B2B platforms, classifieds)
  - Healthtech (digital health, telemedicine, health-for-impact)
  - Media / content (streaming, creator tools, content platforms)
  - AI / ML platforms (LLM platforms, agent platforms, ML tooling)
  - Consumer social / social commerce
  - B2B SaaS / devtools
  - Impact / climate / edtech / govtech

sectors_inactive:
  - Telecom (extensive prior experience, not actively seeking more)

sectors_refuse:
  - Crypto / web3 (pure-play exchanges, DeFi, NFT platforms)
  - Gambling / betting / lottery

# ============================================================
# COMPANY STAGE
# ============================================================
company_stage:
  - Seed
  - Series A
  - Series B-C
  - Series D+
  - Public
  - Non-profit / NGO

# ============================================================
# COMPENSATION
# Private - agent NEVER echoes these in public artifacts.
# ============================================================
compensation:
  floor_base_usd: 5000
  target_base_usd: 15000
  floor_equity_pct: 1
  target_equity_pct: 10
  floor_cash_comp_usd: 20000
  currency_assumption: "USD-equivalent; convert local currency at market rate"
  relocation_budget_usd:
  notes:

# ============================================================
# HARD RED LINES
# ============================================================
red_lines:
  - "Pure-play crypto / web3 / gambling sectors"
  - "Roles with no budget for the engineering org"

# Do not include these companies or projects in public career material until
# the user removes them from this list.
application_exclusions:
  - "Man & Robot Digital / Arka OS"

# ============================================================
# NICE-TO-HAVES
# ============================================================
nice_to_haves:
  - "Healthy culture and strong treatment of people"
  - "Founder-led company where senior leaders work directly with founders"
  - "AI-native product where LLMs/agents are useful rather than decorative"
  - "Cross-border or multi-country scope"
  - "Engineering culture investment"
