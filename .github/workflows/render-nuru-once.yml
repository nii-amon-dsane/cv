name: Render Nuru CV once

on:
  push:
    paths:
      - ".github/workflows/render-nuru-once.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderer
        run: |
          brew install pandoc typst
      - name: Render Nuru CV
        run: |
          bash scripts/render_pdfs.sh applications/nuru-solutions__head-of-engineering-data__2026-10-07
          test -s applications/nuru-solutions__head-of-engineering-data__2026-10-07/cv.pdf
      - name: Commit rendered PDF and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/render-nuru-once.yml
          git add applications/nuru-solutions__head-of-engineering-data__2026-10-07/cv.pdf
          git commit -m "Render corrected Nuru CV"
          git push
